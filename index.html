<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Llista de la compra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--ac:#2f7d5b;--acbg:#dff0e8;--bd:#e4e2da;--warn:#c4552d}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#161615;--card:#222221;--tx:#efeee9;--mut:#9a988f;--ac:#5fbf92;--acbg:#1f3a2e;--bd:#33332f;--warn:#e07a52}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;padding:0 14px 90px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
h1{font-size:20px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;background:var(--bd);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px;border-radius:9px}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px #0002}
.sec{margin:18px 0 6px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:6px;width:100%;text-align:left;font:inherit;color:var(--tx)}
.row .n{flex:1}
.row .n small{display:block;color:var(--mut);font-size:12px}
.row .q{color:var(--mut);font-size:14px}
.row.need{background:var(--acbg);border-color:var(--ac)}
.row.need .tag{background:var(--ac);color:#fff}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--bd);color:var(--mut);white-space:nowrap}
.row.got{opacity:.45;text-decoration:line-through}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ac);flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.got .chk{background:var(--ac)}
.step{border:1px solid var(--bd);background:var(--card);color:var(--tx);min-width:30px;height:30px;border-radius:8px;font:inherit;font-size:18px}
h1 .step{font-size:14px;padding:0 12px}
.pick{flex-wrap:wrap}
.pick .lbl{width:100%;font-weight:600}
.pick .step{font-size:14px;padding:0 12px;height:36px;border-color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bar div{max-width:640px;margin:0 auto;display:flex;gap:8px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
input{flex:1}
#q{width:100%;margin-top:8px}
.go{border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;border-radius:10px;padding:10px 16px}
.ghost{border:1px solid var(--bd);background:none;color:var(--mut);font:inherit;border-radius:10px;padding:10px 14px;width:100%;margin-top:14px}
.msg{padding:30px 10px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1><span>🛒 Llista de la compra</span><button id="ed" class="step">Editar</button></h1>
  <div class="tabs">
    <button id="t1" class="on">Reposició</button>
    <button id="t2">Comprar <span id="cnt"></span></button>
  </div>
  <input id="q" type="search" placeholder="Cerca un producte…">
</header>
<main id="main"><div class="msg">Carregant…</div></main>
<div class="bar"><div>
  <input id="nn" placeholder="Producte nou…" maxlength="60">
  <select id="ns"></select>
  <button class="go" id="add">+</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD2q_IZM0VIZgdoMibaeaklfaRqTs_ynyM",
  authDomain: "llista-compra-41072.firebaseapp.com",
  projectId: "llista-compra-41072",
  storageBucket: "llista-compra-41072.firebasestorage.app",
  messagingSenderId: "585020372918",
  appId: "1:585020372918:web:7d091b4982e48314c9b317"
};

const STORES=["Àrea Guissona","Cal Valls","Feliu Badaló","Lidl"];
const CAT={
"Lidl":["Formatge d'all","Formatge de mel i orenga","Rulo vegetal","Llevat per fer pa","Iogurts"],
"Àrea Guissona":["Formatge fumat d'ovella","Formatge curat d'ovella","Menjar gata","Iogurts","Cacau en pols","Carn de porc","Pernil salat"],
"Feliu Badaló":["Pasta de dents","Aftershave","Tint cabell","Complements alimentaris","Desodorant llimona","Desodorant rosa","Acondicionador cabell rosa","Algues","Kombutxa","Caldo desidratat","Pebre","Curry"],
"Cal Valls":["Fruita","Verdura","Bolets","Sucs","Azuki","Cigrons","Sal marina gruixuda","Sal marina fina","Arròs","Pipes de carbassa","Pipes de girasol","Llinassa","Sèsam","Cúrcuma","Gengibre","Plantes","All","Canonge","Rúcula","Mesclum","Ous","Ametlla natural","Ametlla pelada","Avellana natural","Anacards","Navius","Dàtils","Pistatxo torrats","Patates fregides","Tallarines DEM","Espirals DEM","Espaguetis DEM","Fideus DEM","Sopa de lletres DEM","Xocolata en pols","Farina d'espelta DEM","Snacks de poma","Snacks de plàtan","Espècies"]
};
let db=null,col=null,items=[],mode="reponer",editing=false,picking=null;
const $=s=>document.querySelector(s);
const ref=id=>col.doc(id);
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||("x"+Date.now());
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const safe=p=>p.catch(e=>{console.error(e);alert("No s'ha pogut desar. Revisa la connexió.")});
const stOf=i=>Array.isArray(i.stores)&&i.stores.length?i.stores:["Altres"];
const buyOf=i=>i.buy||stOf(i)[0];
const byName=(a,b)=>a.name.localeCompare(b.name,"ca");

function seedDocs(){
  const m={};
  STORES.forEach(st=>CAT[st].forEach(n=>{const id=slug(n);(m[id]=m[id]||{name:n,stores:[]}).stores.push(st)}));
  return Object.entries(m).map(([id,v])=>[id,{name:v.name,stores:v.stores,need:false,buy:"",got:false,qty:1}]);
}
$("#ns").innerHTML=STORES.map(s=>`<option>${s}</option>`).join("");
$("#ed").onclick=()=>{editing=!editing;mode="reponer";picking=null;render()};
$("#t1").onclick=()=>{mode="reponer";render()};
$("#t2").onclick=()=>{mode="comprar";editing=false;picking=null;render()};
$("#q").oninput=render;

function groups(list,keyFn){
  const keys=STORES.concat([...new Set(list.map(keyFn).filter(k=>!STORES.includes(k)))]);
  return keys.map(k=>[k,list.filter(i=>keyFn(i)===k).sort(byName)]).filter(g=>g[1].length);
}
function render(){
  $("#ed").textContent=editing?"Fet":"Editar";
  $("#t1").classList.toggle("on",mode==="reponer");
  $("#t2").classList.toggle("on",mode==="comprar");
  $("#q").style.display=mode==="reponer"?"":"none";
  const need=items.filter(i=>i.need);
  const pend=need.filter(i=>!i.got).length;
  $("#cnt").textContent=pend?"("+pend+")":"";
  const m=$("#main");m.innerHTML="";
  let list=mode==="reponer"?items:need;
  if(mode==="reponer"){const q=norm($("#q").value.trim());if(q)list=list.filter(i=>norm(i.name).includes(q))}
  if(!list.length){
    if(mode==="reponer"&&!items.length){
      m.innerHTML=`<div class="empty">El catàleg està buit.<br><br><button class="go" id="seed">Carrega el catàleg inicial</button></div>`;
      $("#seed").onclick=seed;
    }else m.innerHTML=`<div class="empty">${mode==="reponer"?"Cap resultat.":"No falta res 🎉"}</div>`;
    return;
  }
  const g=mode==="reponer"?groups(list,i=>stOf(i)[0]):groups(list,buyOf);
  g.forEach(([store,arr])=>{
    const h=document.createElement("div");h.className="sec";h.textContent=store;m.appendChild(h);
    arr.forEach(i=>m.appendChild(mode==="reponer"?rowReponer(i):rowComprar(i)));
  });
  if(editing){
    const L="Restableix el catàleg inicial (esborra tot)";
    const b=document.createElement("button");b.className="ghost";b.textContent=L;let armed=false;
    b.onclick=()=>{if(!armed){armed=true;b.textContent="Segur? Torna a prémer";setTimeout(()=>{armed=false;b.textContent=L},3000)}else reset()};
    m.appendChild(b);
  }
  if(mode==="comprar"&&need.some(i=>i.got)){
    const b=document.createElement("button");b.className="ghost";b.textContent="Acabar la compra (netejar els marcats)";
    b.onclick=()=>need.filter(i=>i.got).forEach(i=>safe(ref(i.id).update({need:false,got:false,qty:1,buy:""})));
    m.appendChild(b);
  }
}
function rowReponer(i){
  const multi=stOf(i).length>1;
  if(editing){
    const r=document.createElement("div");r.className="row";
    r.innerHTML=`<span class="n"></span><button class="step ren">✏️</button><button class="step del">🗑</button>`;
    r.firstChild.textContent=i.name;
    if(multi){const s=document.createElement("small");s.textContent=stOf(i).join(" · ");r.firstChild.appendChild(s)}
    r.querySelector(".ren").onclick=()=>{const v=prompt("Nou nom del producte:",i.name);if(v&&v.trim())safe(ref(i.id).update({name:v.trim()}))};
    const b=r.querySelector(".del");b.style.padding="0 10px";
    let armed=false;
    b.onclick=()=>{if(!armed){armed=true;b.textContent="Esborrar?";b.style.color="var(--warn)";setTimeout(()=>{armed=false;b.textContent="🗑";b.style.color=""},3000)}else safe(ref(i.id).delete())};
    return r;
  }
  if(picking===i.id&&!i.need){
    const r=document.createElement("div");r.className="row pick";
    r.innerHTML=`<span class="lbl"></span>`;
    r.firstChild.textContent=i.name+" — on el compres?";
    stOf(i).forEach(st=>{
      const b=document.createElement("button");b.className="step";b.textContent=st;
      b.onclick=()=>{picking=null;safe(ref(i.id).update({need:true,got:false,qty:1,buy:st}))};
      r.appendChild(b);
    });
    const c=document.createElement("button");c.className="step";c.textContent="✕";c.onclick=()=>{picking=null;render()};
    r.appendChild(c);
    return r;
  }
  const r=document.createElement("div");r.className="row"+(i.need?" need":"");
  r.innerHTML=`<span class="n"></span>${i.need&&i.qty>1?`<span class="q">×${i.qty}</span>`:""}<span class="tag"></span>`;
  r.firstChild.textContent=i.name;
  if(multi){const s=document.createElement("small");s.textContent=stOf(i).join(" · ");r.firstChild.appendChild(s)}
  r.querySelector(".tag").textContent=i.need?(multi?"Falta · "+buyOf(i):"Falta"):"Hi ha";
  r.style.cursor="pointer";
  r.onclick=()=>{
    if(i.need)safe(ref(i.id).update({need:false,got:false,qty:1,buy:""}));
    else if(multi){picking=i.id;render()}
    else safe(ref(i.id).update({need:true,got:false,qty:1,buy:stOf(i)[0]}));
  };
  if(i.need){
    const mk=(t,d)=>{const b=document.createElement("button");b.className="step";b.textContent=t;
      b.onclick=e=>{e.stopPropagation();safe(ref(i.id).update({qty:Math.max(1,(i.qty||1)+d)}))};return b};
    r.insertBefore(mk("−",-1),r.querySelector(".tag"));r.insertBefore(mk("+",1),r.querySelector(".tag"));
  }
  return r;
}
function rowComprar(i){
  const r=document.createElement("button");r.className="row"+(i.got?" got":"");
  r.innerHTML=`<span class="chk">${i.got?"✓":""}</span><span class="n"></span>${i.qty>1?`<span class="q">×${i.qty}</span>`:""}`;
  r.querySelector(".n").textContent=i.name;
  r.onclick=()=>safe(ref(i.id).update({got:!i.got}));
  return r;
}
function seed(){
  const b=db.batch();
  seedDocs().forEach(([id,d])=>b.set(ref(id),d));
  safe(b.commit());
}
function reset(){
  const b=db.batch();
  items.forEach(i=>b.delete(ref(i.id)));
  seedDocs().forEach(([id,d])=>b.set(ref(id),d));
  editing=false;picking=null;safe(b.commit());
}
$("#add").onclick=async()=>{
  const name=$("#nn").value.trim();if(!name||!col)return;
  const id=slug(name),st=$("#ns").value;
  const ex=items.find(i=>i.id===id);
  if(ex)await safe(ref(id).update({stores:firebase.firestore.FieldValue.arrayUnion(st),need:true,got:false,buy:st}));
  else{const need=mode==="comprar";await safe(ref(id).set({name,stores:[st],need,buy:need?st:"",got:false,qty:1}))}
  $("#nn").value="";
};
$("#nn").addEventListener("keydown",e=>{if(e.key==="Enter")$("#add").click()});

try{
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();col=db.collection("items");
  col.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    e=>{$("#main").innerHTML=`<div class="msg">No s'ha pogut carregar la llista. Revisa les regles de Firebase.<br><small>${e.code||""}</small></div>`});
}catch(e){$("#main").innerHTML=`<div class="msg">Error en connectar amb Firebase.</div>`}
</script>
</body>
</html>
